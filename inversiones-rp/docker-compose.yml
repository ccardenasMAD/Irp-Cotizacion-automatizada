version: '3.8'

services:
  #  backend of the Node.js (Express)
  api-irp:
    build: ./backend  
    container_name: irp_backend
    ports:
      - "5001:5001"
    env_file:
      - .env           
    networks:
      - irp-network

  # n8n
  n8n:
    image: n8nio/n8n:latest
    container_name: irp_n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_PORT=5678
    networks:
      - irp-network

networks:
  irp-network:
    driver: bridge